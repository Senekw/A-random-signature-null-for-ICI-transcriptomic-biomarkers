name: tests

# The unit tests build small synthetic matrices with known analytic
# answers, so CI runs without downloading any cohort data.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -q

      - name: Check pipeline scripts are importable and self-documenting
        run: |
          for f in scripts/*.py; do
            python -c "import ast,sys; m=ast.parse(open('$f').read()); \
              assert ast.get_docstring(m), '$f has no module docstring'"
          done
