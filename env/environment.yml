# Python environment for the icinull harness.
#   conda env create -f env/environment.yml && conda activate icinull
#   pip install -e .
name: icinull
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - pyyaml>=6.0
  - pytest>=7.4
  - pip
