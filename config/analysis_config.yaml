# Pre-specified analysis configuration.
# Every value here was fixed before performance metrics were computed
# (see docs/methods_prespec.md). Changing a value invalidates the
# pre-specification and must be recorded as a deviation.

seed: 20260705
seed_stability_check: [20260705, 1, 42]

# ---- Cohort inclusion gate (G1-G3), fixed a priori ----
inclusion_gate:
  min_response_labeled: 20      # G1
  min_minority_class: 5         # G2
  min_measured_genes: 10000     # G3

# ---- Expression harmonization ----
expression:
  # Map both the expression index and signature genes onto current NCBI
  # official symbols before joining them. Load-bearing: the cohorts were
  # processed against different GENCODE vintages (Van_Allen/Miao1/Braun/Puch
  # carry pre-2020 histone symbols, the rest carry current ones), so without
  # this a gene set written with retired symbols matches in some cohorts and
  # vanishes in others -- making a signature's realized size, its
  # size-matched null and its meta-analysis weight depend on annotation
  # vintage rather than biology. See src/icinull/symbols.py.
  harmonize_symbols: true
  assay: expr_gene_tpm          # ORCESTRA MAE experiment name; log2-TPM
  symbol_column: gene_name      # rowData column carrying HUGO symbols
  duplicate_symbol_rule: max_mean_expression
  expressed_gene_rule:
    # A gene enters the "expressed universe" (the pool random sets are
    # drawn from, and the denominator for G3) if it is detected in at
    # least this fraction of samples in the cohort.
    min_detected_fraction: 0.20

# ---- Response definition ----
response:
  primary:
    responders: [CR, PR]
    non_responders: [SD, PD]
  strict:                       # sensitivity analysis: discard SD
    responders: [CR, PR]
    non_responders: [PD]

# ---- Scoring ----
scoring:
  primary: mean_z               # mean of per-gene z-scores within cohort
  sensitivity: ssgsea
  ssgsea_alpha: 0.25
  # A signature is scored if at least this many of its genes are measured in
  # the cohort. MUST be 1: three of the 12 canonical predictors named in the
  # Methods (PD-L1/CD274, PD-1/PDCD1, CTLA-4) are single-gene markers, so a
  # floor of 2 silently deletes them from every cohort -- 45 tests, and it
  # biases the canonical null-beating rate by dropping a quarter of the
  # canonical set.
  #
  # This value is set from the Methods' explicit inclusion of single-gene
  # markers, NOT from a coverage statistic. For the record, the Methods also
  # state "median gene coverage of signatures in cohorts was 92%", and this
  # pipeline does not reproduce that figure: the median here is 100% (most
  # signatures are fully measured in most cohorts) and it is the MEAN that
  # lands near 92% (91.8% over tests with >=1 gene covered). Those are
  # different statistics and the discrepancy is unresolved -- see
  # docs/reproduction_report.md. Do not treat the mean as corroboration.
  min_genes_covered: 1

# ---- Per-signature-per-cohort evaluability ----
evaluability:
  min_samples: 15
  require_both_classes: true

# ---- Random-signature null ----
null_model:
  n_draws: 1000
  size_matching: realized       # match the signature's realized (covered) size
  universe: expressed_genes     # per-cohort expressed universe
  scoring: mean_z
  alternative: greater          # one-sided: P(random AUROC >= observed)
  pooling: stouffer             # across cohorts, on z-vs-null statistics
  fdr_method: fdr_bh

# ---- Meta-analysis ----
meta:
  scale: logit_auroc
  estimator: REML
  adjustment: hartung_knapp     # Hartung-Knapp-Sidik-Jonkman
  se_estimator: hanley_mcneil
  leave_one_cohort_out: true

# ---- Confound / single-axis analysis ----
axis:
  reference_signature: T_cell_inflamed_GEP_Ayers_et_al
  pca_on: standardized_signature_scores
  estimate_partial_out: immune_score

# ---- Constructive ceiling (leave-one-cohort-out) ----
ceiling:
  model: l2_logistic
  C: 0.3
  standardize_on: training_cohorts
  cluster_bootstrap_n: 2000
  predictors:
    - gep_axis
    - estimate_immune
    - full_panel
    - full_panel_plus_infiltration
    - random_panel
